<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbital · Recall</title>
<style>
  /* docs/03 tokens — tuned for 1080p video, not for a dashboard */
  :root {
    /* --card was #1a1b16 on --ink #12130f: a 1.08:1 contrast ratio, where the only
       thing separating a panel from the page was a 1px gap that disappears into
       banding on a compressed 1080p stream and on a projector. Lifted, and every
       panel now carries an explicit rule as well.

       Measured against these values: card/ink 1.15:1 (was 1.08:1), and the rule —
       which is what actually draws the panel edge, via the 1px grid gap — is 1.95:1
       on card and 2.24:1 on ink. Text contrast stays AA on the lifted card:
       text 13.1:1, muted 5.4:1, alarm 4.6:1, teal 6.8:1. Lifting --card further
       would push muted and alarm below 4.5:1, so the rule carries the separation. */
    --ink:#12130f; --card:#20211a; --rule:#4e4f41; --text:#e9e7dd;
    --muted:#97948a; --amber:#e6a53f; --teal:#5fb8a0; --alarm:#c9705c;
  }
  * { box-sizing:border-box; margin:0; }
  body {
    background:var(--ink); color:var(--text); min-height:100vh; padding:20px;
    font:16px/1.45 system-ui, sans-serif;
  }
  .mono { font-family:ui-monospace, "JetBrains Mono", Menlo, monospace; }
  main { max-width:1080px; margin:0 auto; display:grid; gap:1px;
         grid-template-columns:1fr 1fr; background:var(--rule);
         border:1px solid var(--rule); }
  section, header.bar { background:var(--card); padding:18px 20px; }
  header.bar { grid-column:1/-1; display:flex; justify-content:space-between;
               align-items:baseline; flex-wrap:wrap; gap:8px; }
  .brand { color:var(--muted); letter-spacing:.08em; }
  .brand b { color:var(--text); }
  #clock { font-size:2.1rem; color:var(--amber); }
  #inc-ref { color:var(--muted); margin-right:.6em; }
  h2 { font-size:.78rem; letter-spacing:.14em; color:var(--muted);
       text-transform:uppercase; margin-bottom:12px; font-weight:600; }
  .full { grid-column:1/-1; }
  #title { font-size:1.25rem; margin:6px 0 8px; }
  .meta { color:var(--muted); }
  .sev { color:var(--alarm); }
  .match { display:flex; gap:14px; padding:6px 0; align-items:baseline; }
  .match .dot { color:var(--teal); }
  .match .id { min-width:9ch; }
  .match .age { color:var(--muted); margin-left:auto; }
  #diag-head { display:flex; justify-content:space-between; align-items:baseline; }
  #badge { font-size:1.15rem; padding:2px 12px; border:1px solid var(--rule); }
  #badge.high { color:var(--teal); border-color:var(--teal); }
  #badge.low  { color:var(--amber); border-color:var(--amber); }
  #badge.none { color:var(--muted); }
  #diagnosis { margin-top:10px; white-space:pre-wrap; }
  #log { list-style:none; color:var(--muted); font-size:.92rem; }
  #log li { padding:2px 0; border-bottom:1px solid var(--rule); white-space:pre; }
  #log li:first-child { color:var(--text); }
  /* An error row is not a failure to hide — a rejected citation is the enforcement
     working, and it is the shot the demo script points at. */
  #log li.err { color:var(--alarm); }
  #live { font-size:.85rem; letter-spacing:.04em; }
  .live-ok { color:var(--teal); }
  .live-bad { color:var(--alarm); }
  .empty { color:var(--muted); }
  a, button { color:inherit; }
  :focus-visible { outline:2px solid var(--amber); outline-offset:2px; }
  @media (max-width:700px) { main { grid-template-columns:1fr; } #clock { font-size:1.6rem; } }
</style>
</head>
<body>
<main>
  <header class="bar">
    <div class="brand">ORBITAL · <b>Recall</b> <span id="live" class="mono live-bad" role="status">● no data</span></div>
    <div class="mono"><span id="inc-ref">—</span><span id="clock" aria-label="elapsed incident time">00:00:00</span></div>
  </header>

  <section aria-labelledby="h-incident">
    <h2 id="h-incident">Active incident</h2>
    <div class="meta mono"><span id="service">—</span> · <span id="severity" class="sev">—</span></div>
    <div id="title">waiting for incident…</div>
    <div class="meta mono" id="opened"></div>
  </section>

  <section aria-labelledby="h-memory">
    <h2 id="h-memory">Memory</h2>
    <div id="memory"><div class="empty">no retrieval yet</div></div>
  </section>

  <section class="full" aria-labelledby="h-diag">
    <div id="diag-head"><h2 id="h-diag">Diagnosis</h2>
      <span id="badge" class="mono none">—</span></div>
    <div id="diagnosis" class="empty">no diagnosis proposed</div>
  </section>

  <section class="full" aria-labelledby="h-log">
    <h2 id="h-log">Event log</h2>
    <ul id="log" class="mono"></ul>
  </section>
</main>

<script>
  // Config by query param — one page, zero build (docs/03).
  //   ?incident_id=INC-2094        which incident to watch (required)
  //   ?api=https://xyz.lambda-url  Function URL base (default: same origin)
  //   ?memory=off                  AC12 amnesia arm — a label, not a filter
  //
  // The flag no longer changes what this page displays. It used to blank the memory
  // panel client-side, which would have filmed as an A/B while actually comparing the
  // page against itself. The arm is now chosen at ingest (POST ?memory=off runs the
  // agent with the memory tools withheld), so the ungrounded answer, its empty
  // retrieval and its `none` confidence are real values read from working_state.
  // All this flag does here is caption which arm you are looking at.
  const q = new URLSearchParams(location.search);
  const API = (q.get("api") || "").replace(/\/$/, "");
  const INCIDENT = q.get("incident_id") || "";
  const MEMORY_ON = q.get("memory") !== "off";
  const $ = id => document.getElementById(id);

  let openedAt = null, lastState = {};

  // The signature element: ticks every second, never stops — including during
  // the node kill. It is information (proof the take is live), not decoration,
  // so it ticks under prefers-reduced-motion too (docs/03).
  setInterval(() => {
    if (!openedAt) return;
    const s = Math.max(0, Math.floor((Date.now() - openedAt) / 1000));
    const p = n => String(n).padStart(2, "0");
    $("clock").textContent = `${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;
  }, 1000);

  function renderMemory(matchesJson) {
    const box = $("memory");
    let parsed = matchesJson;
    if (typeof parsed === "string") { try { parsed = JSON.parse(parsed); } catch { parsed = null; } }
    const matches = parsed && parsed.matches ? parsed.matches : [];
    if (!matches.length) {
      box.innerHTML = MEMORY_ON
        ? '<div class="empty">no close match in memory — 0 incidents within threshold</div>'
        : '<div class="empty">memory withheld for this run — the agent answered from the alert alone</div>';
      return;
    }
    box.innerHTML = "";
    for (const m of matches.slice(0, 3)) {
      const row = document.createElement("div");
      row.className = "match mono";
      const sim = (1 - m.distance / 2).toFixed(2);
      const age = m.resolved_at
        ? Math.round((Date.now() - Date.parse(m.resolved_at)) / 864e5) + "d" : "—";
      row.innerHTML = `<span class="dot">●</span><span class="id"></span>` +
                      `<span class="sim">${sim}</span><span class="age">${age}</span>`;
      row.querySelector(".id").textContent = m.external_id || m.id.slice(0, 8);
      box.appendChild(row);
    }
  }

  function render(s) {
    $("inc-ref").textContent = s.external_id || s.incident_id.slice(0, 8);
    $("service").textContent = s.service;
    $("severity").textContent = s.severity;
    $("title").textContent = `“${s.title}”`;
    if (s.opened_at) {
      openedAt = Date.parse(s.opened_at);
      $("opened").textContent = "opened " + new Date(openedAt).toTimeString().slice(0, 5);
    }
    renderMemory(s.retrieved_matches);
    // Both arms render whatever the database actually holds. The amnesia arm's
    // 'none' and its ungrounded answer are real values written by the loop, so
    // suppressing them here would be faking the very comparison being filmed.
    const badge = $("badge");
    const conf = s.confidence || "";
    badge.textContent = conf ? conf.toUpperCase() : "—";
    badge.className = "mono " + (conf || "none");
    const d = $("diagnosis");
    if (s.proposed_diagnosis) {
      d.textContent = s.proposed_diagnosis; d.className = "";
    }
    lastState = s;
  }

  // The decision log, straight from agent_runs via GET /runlog — what the agent
  // actually did, with real per-step latency and token counts. It replaces a log
  // built from state deltas observed in the browser, which looked like a system log
  // and was not one: every line was inferred, and it could never show the `error`
  // rows that ARE the refusal proof.
  //
  // It also fills the dead air. Between the POST and the first working_state write
  // the page used to sit on "waiting for incident…" while the agent — the product —
  // was invisible. agent_runs rows appear as each step executes.
  function renderLog(steps) {
    const ul = $("log");
    ul.innerHTML = "";
    if (!steps.length) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "no steps yet";
      ul.appendChild(li);
      return;
    }
    for (const s of steps.slice().reverse()) {   // newest first
      const li = document.createElement("li");
      if (s.outcome === "error") li.className = "err";
      const tokens = (s.input_tokens || s.output_tokens)
        ? `${s.input_tokens || 0}+${s.output_tokens || 0}tok` : "";
      li.textContent = [
        String(s.seq).padStart(2, "0"), s.step_type, s.name,
        s.outcome, `${s.latency_ms}ms`, tokens,
      ].join("  ");
      if (s.detail) li.title = s.detail;   // the rejected citation, on hover
      ul.appendChild(li);
    }
  }

  // One indicator, so a wrong ID, a cold Lambda and a CORS-blocked request stop
  // looking identical — all three used to render as a page that seemed not to have
  // loaded, which is the worst thing to be debugging mid-take.
  function setLive(ok, why) {
    const el = $("live");
    el.textContent = ok ? "● live" : "● no data";
    el.className = "mono live-" + (ok ? "ok" : "bad");
    el.title = why || "";
  }

  async function getJSON(path) {
    const r = await fetch(`${API}${path}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  async function poll() {
    if (!INCIDENT) {
      $("title").textContent = "add ?incident_id=… to the URL";
      setLive(false, "no incident_id in the URL");
      return;
    }
    const id = encodeURIComponent(INCIDENT);
    // Both in flight together: the run log is live well before working_state has
    // anything to show, so it must not wait on /status.
    const [status, runlog] = await Promise.allSettled([
      getJSON(`/status?incident_id=${id}`),
      getJSON(`/runlog?incident_id=${id}`),
    ]);
    if (status.status === "fulfilled") {
      render(status.value);
      setLive(true);
    } else {
      setLive(false, status.reason.message);
    }
    if (runlog.status === "fulfilled") {
      renderLog(runlog.value.steps || []);
      if (status.status !== "fulfilled") setLive(true, "run log only — no incident row yet");
    }
  }
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
