<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 580" width="1060" height="580" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif">
  <title id="t">Recall — C4 Level 1, System Context</title>
  <desc id="d">An on-call engineer and an alerting system interact with Recall, which depends on AWS Bedrock for reasoning and embeddings.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#97948a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1060" height="580" fill="#12130f"/>
  <text x="40" y="50" fill="#e9e7dd" font-size="22" font-weight="bold">Recall — System Context</text>
  <text x="40" y="74" fill="#97948a" font-size="13">C4 Level 1 · who talks to the system, and what it depends on</text>

  <!-- On-call engineer -->
  <g>
    <rect x="40" y="185" width="200" height="110" rx="10" fill="#1a1b16" stroke="#5fb8a0" stroke-width="2"/>
    <text x="140" y="222" fill="#e9e7dd" font-size="17" font-weight="bold" text-anchor="middle">On-call engineer</text>
    <text x="140" y="243" fill="#97948a" font-size="12" text-anchor="middle">[Person]</text>
    <text x="140" y="267" fill="#97948a" font-size="12.5" text-anchor="middle">Diagnoses at 2 a.m.</text>
    <text x="140" y="284" fill="#97948a" font-size="12.5" text-anchor="middle">Closes the incident.</text>
  </g>

  <!-- Recall (the system in focus) -->
  <g>
    <rect x="400" y="150" width="260" height="180" rx="10" fill="#1a1b16" stroke="#e6a53f" stroke-width="2.5"/>
    <text x="530" y="191" fill="#e9e7dd" font-size="19" font-weight="bold" text-anchor="middle">Recall</text>
    <text x="530" y="212" fill="#97948a" font-size="12" text-anchor="middle">[Software System]</text>
    <text x="530" y="241" fill="#97948a" font-size="12.5" text-anchor="middle">Remembers every past incident and</text>
    <text x="530" y="259" fill="#97948a" font-size="12.5" text-anchor="middle">proposes a diagnosis grounded in a</text>
    <text x="530" y="277" fill="#97948a" font-size="12.5" text-anchor="middle">real past resolution.</text>
    <text x="530" y="303" fill="#e6a53f" font-size="12.5" text-anchor="middle">Its memory survives the outage</text>
    <text x="530" y="320" fill="#e6a53f" font-size="12.5" text-anchor="middle">it is diagnosing.</text>
  </g>

  <!-- Alerting -->
  <g>
    <rect x="820" y="185" width="200" height="110" rx="10" fill="#1a1b16" stroke="#2c2d26" stroke-width="1.5"/>
    <text x="920" y="222" fill="#e9e7dd" font-size="16" font-weight="bold" text-anchor="middle">Alerting / monitoring</text>
    <text x="920" y="243" fill="#97948a" font-size="12" text-anchor="middle">[External system]</text>
    <text x="920" y="267" fill="#97948a" font-size="12.5" text-anchor="middle">Fires the alert that</text>
    <text x="920" y="284" fill="#97948a" font-size="12.5" text-anchor="middle">starts everything.</text>
  </g>

  <!-- AWS Bedrock -->
  <g>
    <rect x="400" y="420" width="260" height="110" rx="10" fill="#1a1b16" stroke="#2c2d26" stroke-width="1.5"/>
    <text x="530" y="457" fill="#e9e7dd" font-size="17" font-weight="bold" text-anchor="middle">AWS Bedrock</text>
    <text x="530" y="478" fill="#97948a" font-size="12" text-anchor="middle">[External system]</text>
    <text x="530" y="502" fill="#97948a" font-size="12.5" text-anchor="middle">Claude for reasoning,</text>
    <text x="530" y="519" fill="#97948a" font-size="12.5" text-anchor="middle">Titan V2 for embeddings.</text>
  </g>

  <!-- Edges -->
  <path d="M 392 214 L 254 214" fill="none" stroke="#97948a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="323" y="205" fill="#e9e7dd" font-size="12" text-anchor="middle">diagnosis + citations</text>

  <path d="M 248 268 L 390 268" fill="none" stroke="#97948a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="319" y="289" fill="#e9e7dd" font-size="12" text-anchor="middle">closes the incident</text>

  <path d="M 812 240 L 670 240" fill="none" stroke="#97948a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="741" y="231" fill="#e9e7dd" font-size="12" text-anchor="middle">POSTs alert JSON</text>

  <path d="M 530 338 L 530 412" fill="none" stroke="#97948a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="546" y="380" fill="#e9e7dd" font-size="12">Converse + embeddings</text>
</svg>
