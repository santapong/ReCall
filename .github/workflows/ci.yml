# Fast suite on every PR and on the long-lived branches (docs/07 CI mapping).
# The full suite (single-node cockroach service + AC2 eval) is added to pushes on
# `release/**` in P1, when the first DB-backed test exists — mocked-DB tests stay banned.
name: ci

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
